<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00aa88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008866;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 中心图标组 -->
  <g transform="translate(200, 200)">
    <!-- 1. 服务器主体 -->
    <rect x="-50" y="-40" width="100" height="80" rx="8" stroke="url(#primaryGradient)" stroke-width="3.5" fill="white"/>

    <!-- 2. 服务器分层 -->
    <line x1="-50" y1="-13" x2="50" y2="-13" stroke="#e9ecef" stroke-width="2"/>
    <line x1="-50" y1="13" x2="50" y2="13" stroke="#e9ecef" stroke-width="2"/>

    <!-- 3. 左上角红色状态点 -->
    <circle cx="-38" cy="-28" r="3" fill="#ef4444"/>

    <!-- 4. 终端元素 - 左下角 -->
    <path d="M -38,20 L -32,26 L -38,32" stroke="url(#arrowGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="-28" y1="33" x2="-24" y2="33" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 5. 向上箭头 -->
    <line x1="0" y1="-20" x2="0" y2="-6" stroke="url(#arrowGradient)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -8,-17 L 0,-28 L 8,-17" stroke="url(#arrowGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 6. 向下箭头 -->
    <line x1="0" y1="8" x2="0" y2="22" stroke="url(#arrowGradient)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -8,14 L 0,28 L 8,14" stroke="url(#arrowGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
